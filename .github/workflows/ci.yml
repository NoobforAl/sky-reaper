name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck game
        run: npm run typecheck

      - name: Typecheck worker
        run: npm run typecheck:worker

      - name: Build
        run: npx vite build

      - name: Validate Worker bundle (dry run, no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Local D1 migration + API smoke test
        run: |
          npx wrangler d1 migrations apply sky-reaper --local
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/api/health | grep '"db":"ok"'
          curl -sI http://127.0.0.1:8787/ | grep -i 'cache-control: no-cache'
          curl -sf -X POST http://127.0.0.1:8787/api/score \
            -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:8787' \
            -d '{"name":"CI","score":1000,"chapter":"pacific","timeSec":120,"kills":10,"medal":1}'
          curl -sf 'http://127.0.0.1:8787/api/leaderboard?chapter=pacific' | grep '"name":"CI"'
          kill %1 || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs
          path: |
            wrangler-dev.log
            playwright-report
            test-results
          if-no-files-found: ignore
