<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SKY REAPER key art</title>
<style>
  html, body { margin: 0; background: #05070d; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// SKY REAPER key art, composed from the game's real sprites (public/assets). Rendered by scripts/promo/render.mjs.
// Key-art rules applied: one clear hero, logo in reserved negative space, depth (background boss -> mid enemies ->
// hero -> blurred foreground), warm/cool contrast, minimal text (logo + one line), English only.
// ?w=&h= picks the size; layout switches between wide and tall automatically.
const qs = new URLSearchParams(location.search);
const W = Number(qs.get("w") || 1920), H = Number(qs.get("h") || 1080);
const TALL = H > W;
const S = Math.min(W, H) / 270; // pixels per game unit
const LW = W / S, LH = H / S;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const g = cv.getContext("2d");
g.imageSmoothingEnabled = false;

const m = await (await fetch("/public/assets/manifest.json")).json();
const defs = Object.fromEntries(m.sprites.map((s) => [s.key, s]));
const imgs = {};
async function need(key) {
  if (imgs[key]) return imgs[key];
  const d = defs[key];
  if (!d) throw new Error("no sprite " + key);
  const im = new Image();
  im.src = "/public/" + d.src;
  await im.decode();
  return (imgs[key] = { im, d });
}
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
/** sprite frame centred at logical (x,y); sc = game-size multiplier */
async function spr(key, x, y, { frame = 0, sc = 1, rot = 0, alpha = 1, filter = "none" } = {}) {
  if (!defs[key]) return;
  const { im, d } = await need(key);
  const fw = d.frameW || im.width, fh = d.frameH || im.height;
  const cols = Math.max(1, Math.floor(im.width / fw));
  g.save();
  g.globalAlpha = alpha;
  g.filter = filter;
  g.translate(Math.round(x * S), Math.round(y * S));
  if (rot) g.rotate(rot);
  const w = fw * sc * S, h = fh * sc * S;
  g.drawImage(im, (frame % cols) * fw, Math.floor(frame / cols) * fh, fw, fh, -w / 2, -h / 2, w, h);
  g.restore();
}
const P = (fx, fy) => [fx * LW, fy * LH]; // fractional position -> logical

// ---------------------------------------------------------------- layout per orientation
const L = TALL
  ? { logo: P(0.5, 0.13), logoW: 0.86, tag: P(0.5, 0.255),
      hero: P(0.5, 0.77), heroSc: 4.2, heroRot: -0.08, carrier: P(0.86, 0.8), carrierSc: 1.5,
      formation: P(0.5, 0.48), spread: 1.0 }
  : { logo: P(0.27, 0.28), logoW: 0.4, tag: P(0.27, 0.47),
      hero: P(0.66, 0.68), heroSc: 4.4, heroRot: -0.16, carrier: P(0.92, 0.72), carrierSc: 1.55,
      formation: P(0.74, 0.2), spread: 1.15 };

// ---------------------------------------------------------------- 1. ocean + islands
for (let ty = 0; ty < LH + 64; ty += 64)
  for (let tx = 0; tx < LW + 64; tx += 64) await spr("bgtile_ocean_a", tx + 32, ty + 32, { frame: Math.floor(rnd() * 4) });
for (let i = 0; i < 6; i++) {
  const k = "bgdeco_ocean_" + [1, 2, 4, 7][i % 4];
  const [x, y] = TALL ? P(rnd() * 0.3 + (i % 2) * 0.7, 0.35 + rnd() * 0.6) : P(0.02 + rnd() * 0.12 + (i % 2) * 0.33, 0.7 + rnd() * 0.3);
  await spr(k, x, y, { sc: 2 });
}

// ---------------------------------------------------------------- 2. the boss far below (dimmed for depth)
await spr("boss_carrier_hull", L.carrier[0], L.carrier[1], { sc: L.carrierSc, filter: "brightness(0.7)" });
await spr("boss_carrier_bridge", L.carrier[0] + 22 * L.carrierSc, L.carrier[1] - 6, { sc: L.carrierSc * 0.6, filter: "brightness(0.7)" });
for (const dy of [-70, -20, 45]) await spr("boss_carrier_turret", L.carrier[0] - 12 * L.carrierSc, L.carrier[1] + dy * L.carrierSc * 0.6, { sc: L.carrierSc, filter: "brightness(0.7)" });

// atmosphere: cool haze over the sea, warm sun glow from the top
g.fillStyle = "rgba(6,12,30,0.42)";
g.fillRect(0, 0, W, H);
g.save();
g.globalCompositeOperation = "screen";
const sun = g.createRadialGradient(W * (TALL ? 0.7 : 0.82), -H * 0.15, 0, W * (TALL ? 0.7 : 0.82), -H * 0.15, Math.max(W, H) * 0.9);
sun.addColorStop(0, "rgba(255,170,80,0.55)");
sun.addColorStop(0.35, "rgba(255,110,50,0.18)");
sun.addColorStop(1, "rgba(0,0,0,0)");
g.fillStyle = sun;
g.fillRect(0, 0, W, H);
g.restore();
// soft cloud layer between sea and planes
for (let i = 0; i < 5; i++) {
  const [x, y] = P(rnd(), rnd());
  await spr("bgcloud_" + (1 + (i % 3)), x, y, { sc: 3, alpha: 0.25, filter: `blur(${Math.round(S)}px)` });
}

// ---------------------------------------------------------------- 3. enemy formation + kill
const [fx, fy] = L.formation;
const sp = L.spread;
const wing = [[0, 0], [-22, 16], [22, 16], [-44, 32], [44, 32]];
for (let i = 0; i < 26; i++) {
  await spr("ebullet_small", fx + (rnd() - 0.5) * 120 * sp, fy + 20 + rnd() * (L.hero[1] - fy - 40), { frame: i % 2, sc: 1.2 });
}
for (const [dx, dy] of wing) await spr("enemy_fighter_basic", fx + dx * sp, fy + dy * sp, { frame: Math.floor(rnd() * 4), sc: 1.5 });
await spr("enemy_bomber", fx + 70 * sp, fy + 58 * sp, { frame: 1, sc: 1.4 });
await spr("enemy_helicopter", fx - 75 * sp, fy + 62 * sp, { frame: 2, sc: 1.3 });
// one fighter of the V is blowing up
await spr("fx_explosion_l", fx - 22 * sp, fy + 16 * sp, { frame: 3, sc: 1.8 });
for (let i = 0; i < 6; i++) await spr("debris_m", fx - 22 * sp + (rnd() - 0.5) * 34, fy + 16 * sp + (rnd() - 0.5) * 34, { frame: i % 3, rot: rnd() * 6, sc: 1.3 });

// ---------------------------------------------------------------- 4. the hero
const [hx, hy] = L.hero;
// speed lines
g.save();
g.globalCompositeOperation = "screen";
for (let i = 0; i < 18; i++) {
  const x = (hx + (rnd() - 0.5) * 140) * S, y = (hy - 20 + rnd() * 120) * S, len = (30 + rnd() * 60) * S;
  const gr = g.createLinearGradient(x, y, x, y + len);
  gr.addColorStop(0, "rgba(160,220,255,0.0)");
  gr.addColorStop(0.5, "rgba(160,220,255,0.22)");
  gr.addColorStop(1, "rgba(160,220,255,0.0)");
  g.fillStyle = gr;
  g.fillRect(x, y, Math.max(1, S * 0.5), len);
}
g.restore();
// stream of fire toward the formation
const dirX = fx - 22 * sp - hx, dirY = fy + 16 * sp - hy;
const dl = Math.hypot(dirX, dirY);
for (let i = 1; i < 9; i++) {
  const t = (i * 22) / dl;
  if (t > 0.92) break;
  const rot = Math.atan2(dirY, dirX) + Math.PI / 2;
  for (const off of [-7, 7]) {
    await spr("bullet_player_vulcan", hx + dirX * t + off * Math.cos(rot), hy + dirY * t + off * Math.sin(rot), { sc: 1.8, rot });
  }
}
// afterburner glow
const tail = { x: hx * S - Math.sin(L.heroRot) * 46 * S, y: hy * S + 46 * S };
g.save();
g.globalCompositeOperation = "screen";
const ab = g.createRadialGradient(tail.x, tail.y, 0, tail.x, tail.y, 34 * S);
ab.addColorStop(0, "rgba(255,210,120,0.9)");
ab.addColorStop(0.3, "rgba(255,120,40,0.45)");
ab.addColorStop(1, "rgba(255,80,20,0)");
g.fillStyle = ab;
g.fillRect(tail.x - 40 * S, tail.y - 40 * S, 80 * S, 80 * S);
g.restore();
// rim light
await spr("player_falcon", hx, hy, { frame: 0, sc: L.heroSc * 1.04, rot: L.heroRot, alpha: 0.2, filter: `brightness(2.5) blur(${Math.round(S * 1.5)}px)` });
await spr("player_falcon", hx, hy, { frame: 0, sc: L.heroSc, rot: L.heroRot });

// ---------------------------------------------------------------- 5. foreground cloud (blurred, frames the scene)
await spr("bgcloud_1", TALL ? LW * 0.02 : LW * 0.1, LH * 1.0, { sc: 5, alpha: 0.4, filter: `blur(${Math.round(S * 3)}px)` });

// ---------------------------------------------------------------- 6. title lockup
const [lx, ly] = L.logo;
// darken behind the lockup so the logo reads at thumbnail size
const shade = TALL ? g.createLinearGradient(0, 0, 0, H * 0.45) : g.createLinearGradient(0, 0, W * 0.62, 0);
shade.addColorStop(0, "rgba(3,6,16,0.85)");
shade.addColorStop(0.6, "rgba(3,6,16,0.55)");
shade.addColorStop(1, "rgba(3,6,16,0)");
g.fillStyle = shade;
g.fillRect(0, 0, W, H);
// vignette
const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
vg.addColorStop(0, "rgba(0,0,0,0)");
vg.addColorStop(1, "rgba(0,0,0,0.6)");
g.fillStyle = vg;
g.fillRect(0, 0, W, H);

// the game's own logo sprite (crisp integer scale)
{
  const { im, d } = await need("ui_logo");
  const fw = d.frameW || im.width, fh = d.frameH || im.height;
  const sc = Math.max(1, Math.round((L.logoW * W) / fw));
  const w = fw * sc, h = fh * sc;
  g.save();
  g.shadowColor = "rgba(255,140,40,0.45)";
  g.shadowBlur = 8 * S;
  g.drawImage(im, 0, 0, fw, fh, Math.round(lx * S - w / 2), Math.round(ly * S - h / 2), w, h);
  g.restore();
}
// one tagline under the logo (no call to action)
g.textAlign = "center";
g.textBaseline = "middle";
const fs = Math.round(Math.min(W, H) * (TALL ? 0.036 : 0.034));
g.font = `900 ${fs}px "Courier New", ui-monospace, monospace`;
g.fillStyle = "#e8f1ff";
g.shadowColor = "rgba(0,0,0,0.9)";
g.shadowBlur = fs * 0.3;
g.shadowOffsetY = fs * 0.08;
g.fillText("DOMINATE THE SKY. DESTROY THE GROUND.", L.tag[0] * S, L.tag[1] * S);
g.shadowColor = "transparent";
document.title = "ready";
</script>
</body>
</html>
